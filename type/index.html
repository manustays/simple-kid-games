<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1a0533" />
  <title>Typing Fun!</title>
  <link rel="manifest" href="manifest.json" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@800&display=swap" rel="stylesheet" />
  <link rel="icon" href="./public/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="./public/apple-touch-icon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0a1e;
      /* letter key width: fits 10 keys + 9×6px gaps across the keyboard */
      --lkw: clamp(28px, calc((100vw - 16px - 54px) / 10), 42px);
      --c1: #ff4d6d;
      --c2: #ff9f1c;
      --c3: #2ec4b6;
      --c4: #a8dadc;
      --c5: #c77dff;
      --c6: #f72585;
      --c7: #7bdff2;
      --c8: #b2f7ef;
      --c9: #ffe74c;
      --c0: #6aff6a;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Fredoka One', cursive;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    /* Nothing in the chrome or the typed strip is selectable — only #native-edit
       (which lives outside #digits-wrap) stays a real text field. */
    #tab-bar, #panels, #digits-wrap {
      -webkit-user-select: none;
      user-select: none;
    }

    /* Keyboard focus ring — keys set outline:none, so touch is unaffected. */
    .key:focus-visible, .lkey:focus-visible, .ekey:focus-visible,
    .ckey:focus-visible, .tab:focus-visible {
      outline: 3px solid var(--c7);
      outline-offset: 2px;
    }

    /* Starfield bg */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        radial-gradient(1px 1px at 10% 15%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 25% 40%, #fff 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 50% 10%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 30%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 85% 60%, #fff 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 15% 80%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 40% 70%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 60% 85%, #fff 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 90% 90%, #fff 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    #app {
      position: fixed; inset: 0;
      display: flex;
      flex-direction: column;
      z-index: 1;
    }

    /* ── Display area ── */
    #display {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 16px 8px;
      overflow: hidden;
      position: relative;
    }

    #digits-wrap {
      display: flex;
      /* flex-wrap: wrap; */
      align-items: center;
      justify-content: flex-end;
      gap: 26px;
      width: 100%;
    }

    .digit-char {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(52px, 13vw, 110px);
      line-height: 1;
      display: inline-block;
      animation: pop 0.35s cubic-bezier(0.36, 1.56, 0.64, 1) both;
      filter: drop-shadow(0 4px 12px currentColor);
    }

    @keyframes pop {
      0%   { transform: scale(0) rotate(-15deg); opacity: 0; }
      60%  { transform: scale(1.25) rotate(6deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .digit-char:nth-child(10n+1)  { color: var(--c1); }
    .digit-char:nth-child(10n+2)  { color: var(--c2); }
    .digit-char:nth-child(10n+3)  { color: var(--c3); }
    .digit-char:nth-child(10n+4)  { color: var(--c4); }
    .digit-char:nth-child(10n+5)  { color: var(--c5); }
    .digit-char:nth-child(10n+6)  { color: var(--c6); }
    .digit-char:nth-child(10n+7)  { color: var(--c7); }
    .digit-char:nth-child(10n+8)  { color: var(--c8); }
    .digit-char:nth-child(10n+9)  { color: var(--c9); }
    .digit-char:nth-child(10n+0)  { color: var(--c0); }

    /* ── Native keyboard tab: editable text field ── */
    #native-edit {
      display: none;
      width: 100%;
      max-height: 100%;
      overflow-y: auto;
      padding: 8px 12px;
      font-family: 'Fredoka One', cursive;
      font-size: clamp(22px, 6vw, 44px);
      line-height: 1.25;
      text-align: left;
      color: rgba(255,255,255,0.92);
      caret-color: var(--c3);
      word-break: break-word;
      outline: none;
      -webkit-user-select: text;
      user-select: text;
    }
    #native-edit:empty:before {
      content: attr(data-placeholder);
      color: rgba(255,255,255,0.3);
    }
    #native-edit img {
      max-height: clamp(80px, 22vw, 160px);
      max-width: 70%;
      vertical-align: middle;
      border-radius: 12px;
      margin: 4px;
    }
    #display.native #digits-wrap { display: none; }
    #display.native #native-edit { display: block; }

    #keyboard-native {
      display: flex;
      justify-content: center;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
      padding: 10px 12px 14px;
    }
    #keyboard-native .key {
      aspect-ratio: auto;
      flex: 0 0 auto;
      min-width: 120px;
      padding: 14px 28px;
      font-size: clamp(16px, 4vw, 24px);
      border-radius: 14px;
    }

    /* ── Keyboard panel ── */
    #panels {
      background: rgba(255,255,255,0.04);
      border-top: 2px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(8px);
    }

    .panel { display: none; }
    .panel.active { display: block; }

    #keyboard {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
      gap: 10px;
      padding: 10px 12px 14px;
    }

    @media (max-width: 700px) {
      #keyboard {
        max-width: 100%;
        width: 100%;
        gap: 8px;
        padding: 8px 10px 12px;
      }
    }

    /* ── Tab bar ── */
    #tab-bar {
      display: flex;
      background: rgba(0,0,0,0.45);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding-top: env(safe-area-inset-top, 0px);
      padding-left: 40px;
      padding-right: 40px;
    }

    .tab {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 8px 4px;
      color: rgba(255,255,255,0.3);
      border: none;
      background: none;
      outline: none;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.15s;
      position: relative;
    }

    .tab.active {
      color: rgba(255,255,255,0.88);
    }

    .tab.active::before {
      content: '';
      position: absolute;
      bottom: 0; left: 20%; right: 20%;
      height: 2px;
      background: rgba(255,255,255,0.55);
      border-radius: 2px 2px 0 0;
    }

    .tab-icon { font-size: 16px; line-height: 1; }

    .tab-label {
      font-family: 'Nunito', sans-serif;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .key {
      aspect-ratio: 1.3 / 1;
      border-radius: 18px;
      border: none;
      cursor: pointer;
      font-family: 'Fredoka One', cursive;
      font-size: clamp(28px, 7vw, 56px);
      font-weight: 900;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      outline: none;
      transition: transform 0.08s, filter 0.08s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      box-shadow: 0 6px 0 rgba(0,0,0,0.35), 0 2px 12px rgba(0,0,0,0.3);
    }

    .key::after {
      content: '';
      position: absolute; inset: 0;
      background: rgba(255,255,255,0.15);
      border-radius: 18px;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .key:active, .key.pressed { transform: scale(0.92) translateY(3px); filter: brightness(1.2); }
    .key:active::after, .key.pressed::after { opacity: 1; }

    /* Distinct gradient per key */
    .key[data-n="1"]  { background: linear-gradient(135deg, #ff4d6d, #c9184a); }
    .key[data-n="2"]  { background: linear-gradient(135deg, #ff9f1c, #e07b00); }
    .key[data-n="3"]  { background: linear-gradient(135deg, #2ec4b6, #0b9b90); }
    .key[data-n="4"]  { background: linear-gradient(135deg, #c77dff, #9b4dca); }
    .key[data-n="5"]  { background: linear-gradient(135deg, #f72585, #b5179e); }
    .key[data-n="6"]  { background: linear-gradient(135deg, #7bdff2, #38b2cc); }
    .key[data-n="7"]  { background: linear-gradient(135deg, #ffe74c, #e0b000); }
    .key[data-n="8"]  { background: linear-gradient(135deg, #6aff6a, #27a027); }
    .key[data-n="9"]  { background: linear-gradient(135deg, #a8dadc, #52a1a5); }
    .key[data-n="0"]  { background: linear-gradient(135deg, #b2f7ef, #3dbfb3); }
    .key.clear        { background: linear-gradient(135deg, #444, #222); font-size: clamp(18px, 4vw, 32px); letter-spacing: -0.5px; }
    .key.clear:active { transform: scale(0.92) translateY(3px); }
    .key.speech       { background: linear-gradient(135deg, #ffd60a, #ffc300); color: #333; font-size: clamp(16px, 4vw, 28px); letter-spacing: -0.5px; }
    .key.speech.off   { background: linear-gradient(135deg, #999, #666); color: #fff; }
    .key.speech:active { transform: scale(0.92) translateY(3px); }

    /* 0 and clear span full row nicely */
    .key[data-n="0"] { grid-column: span 1; }

    /* Ripple */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
      transform: scale(0);
      animation: ripple-anim 0.5s linear;
      pointer-events: none;
    }
    @keyframes ripple-anim {
      to { transform: scale(4); opacity: 0; }
    }

    /* Floating emoji burst on tap */
    .burst {
      position: fixed;
      font-size: 36px;
      pointer-events: none;
      animation: burst-fly 0.9s ease-out forwards;
      z-index: 999;
    }
    @keyframes burst-fly {
      0%   { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
      100% { transform: translate(-50%, -200%) scale(1.4); opacity: 0; }
    }

    /* ── ABC keyboard (Gboard dark) ── */
    #keyboard-letters {
      padding: 10px 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .letter-row {
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    .lkey {
      width: var(--lkw);
      flex: 0 0 var(--lkw);
      height: 42px;
      border-radius: 5px;
      border: none;
      background: #3a3a3c;
      color: rgba(255,255,255,0.92);
      font-family: 'Nunito', sans-serif;
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      outline: none;
      box-shadow: 0 1px 0 rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.06);
      transition: filter 0.06s, transform 0.06s;
      position: relative;
      overflow: hidden;
    }

    .lkey:active, .lkey.pressed {
      filter: brightness(1.6);
      transform: scale(0.9);
    }

    /* space bar: 3 key widths + 2 inner gaps (voice btn takes the other 2 keys) */
    .lkey-space {
      width: calc(var(--lkw) * 3 + 12px);
      flex: 0 0 calc(var(--lkw) * 3 + 12px);
      background: #2a2a2c;
      color: rgba(255,255,255,0.3);
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* voice toggle: 2 key widths + 1 gap */
    .lkey-voice {
      width: calc(var(--lkw) * 2 + 6px);
      flex: 0 0 calc(var(--lkw) * 2 + 6px);
      font-size: 18px;
    }
    .lkey-voice.off { color: rgba(255,255,255,0.3); }

    /* clear button: same width as voice btn */
    .lkey-clear {
      width: calc(var(--lkw) * 2 + 6px);
      flex: 0 0 calc(var(--lkw) * 2 + 6px);
      background: #2a2a2c;
      color: rgba(255,255,255,0.5);
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    #panel-emoji {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      max-height: 70vh;
    }

    #keyboard-emoji {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(clamp(52px, 13vw, 76px), 1fr));
      gap: 25px;
      padding: 10px 10px 42px;
    }

    .ekey {
      background: none;
      border: none;
      cursor: pointer;
      font-size: clamp(36px, 9vw, 56px);
      line-height: 1;
      padding: 10px 5px;
      touch-action: manipulation;
      border-radius: 8px;
      text-align: center;
      transition: transform 0.1s cubic-bezier(0.36, 1.56, 0.64, 1);
    }

    .ekey:active, .ekey.pressed { transform: scale(0.82); }

    /* Physical-keyboard selection ring (emoji tab) */
    .ekey.sel {
      outline: 3px solid var(--c9);
      outline-offset: -2px;
      border-radius: 12px;
      background: rgba(255,255,255,0.08);
    }

    /* ── Color squares (display area) ── */
    .color-char {
      display: inline-block;
      flex-shrink: 0;
      width: clamp(52px, 13vw, 110px);
      height: clamp(52px, 13vw, 110px);
      border-radius: 16px;
      animation: pop 0.35s cubic-bezier(0.36, 1.56, 0.64, 1) both;
      outline: 2px solid rgba(255,255,255,0.12);
    }

    /* ── Colors keyboard ── */
    #keyboard-colors {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
      gap: 20px;
      padding: 100px 10px;
    }

    @media (max-width: 700px) {
      #keyboard-colors {
        max-width: 100%;
        width: 100%;
      }
    }

    .ckey {
      aspect-ratio: 1.3 / 1;
      border-radius: 18px;
      border: none;
      cursor: pointer;
      font-family: 'Fredoka One', cursive;
      font-size: clamp(18px, 5vw, 32px);
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      outline: none;
      transition: transform 0.08s, filter 0.08s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      box-shadow: 0 6px 0 rgba(0,0,0,0.35), 0 2px 12px rgba(0,0,0,0.3);
      text-shadow: 0 1px 3px rgba(0,0,0,0.35);
    }

    .ckey::after {
      content: '';
      position: absolute; inset: 0;
      background: rgba(255,255,255,0.15);
      border-radius: 18px;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .ckey:active, .ckey.pressed { transform: scale(0.92) translateY(3px); filter: brightness(1.2); }
    .ckey:active::after, .ckey.pressed::after { opacity: 1; }

    /* ── Settings gear + overlay ── */
    #gear-btn {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 4px);
      right: 4px;
      z-index: 50;
      width: 40px; height: 40px;
      border: none;
      background: rgba(0,0,0,0.35);
      color: rgba(255,255,255,0.45);
      font-size: 20px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      outline: none;
      transition: transform 0.2s, color 0.2s;
    }
    #gear-btn:active { transform: scale(0.92); }
    #gear-btn.holding { transform: scale(1.25) rotate(40deg); color: var(--c9); }

    #settings-overlay {
      position: fixed; inset: 0;
      z-index: 100;
      background: rgba(8,4,18,0.82);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    #settings-overlay[hidden] { display: none; }

    #settings-panel {
      width: 100%;
      max-width: 420px;
      max-height: 90vh;
      overflow-y: auto;
      background: #1a1030;
      border: 2px solid rgba(255,255,255,0.10);
      border-radius: 20px;
      padding: 18px 20px 22px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
    }

    .settings-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px;
    }
    .settings-title {
      font-family: 'Fredoka One', cursive;
      font-size: 22px;
      color: #fff;
    }
    #settings-close {
      width: 40px; height: 40px;
      border: none; border-radius: 50%;
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.7);
      font-size: 18px;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      outline: none;
      transition: transform 0.08s;
    }
    #settings-close:active { transform: scale(0.92); }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .settings-row label {
      color: rgba(255,255,255,0.85);
      font-size: 15px;
      flex: 0 0 auto;
    }
    .settings-row label span {
      color: var(--c7);
      font-variant-numeric: tabular-nums;
    }

    #set-voice {
      flex: 1 1 auto;
      min-width: 0;
      max-width: 60%;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.15);
      background: #2a1c45;
      color: #fff;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 14px;
    }

    .settings-row input[type="range"] {
      flex: 1 1 auto;
      min-width: 0;
      max-width: 55%;
      accent-color: var(--c5);
      height: 28px;
    }

    .set-toggle, .set-test {
      border: none;
      border-radius: 12px;
      padding: 10px 20px;
      font-family: 'Fredoka One', cursive;
      font-size: 15px;
      color: #fff;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      outline: none;
      transition: transform 0.08s;
    }
    .set-toggle { background: linear-gradient(135deg, #6aff6a, #27a027); }
    .set-toggle.off { background: linear-gradient(135deg, #999, #666); }
    .set-test { background: linear-gradient(135deg, #c77dff, #9b4dca); width: 100%; }
    .set-toggle:active, .set-test:active { transform: scale(0.94); }

    .set-toggle:disabled, .set-test:disabled,
    #set-voice:disabled, .settings-row input:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
<div id="app">
  <div id="tab-bar">
    <button class="tab active" data-tab="numbers">
      <span class="tab-icon">🔢</span>
      <span class="tab-label">123</span>
    </button>
    <button class="tab" data-tab="letters">
      <span class="tab-icon">🔤</span>
      <span class="tab-label">ABC</span>
    </button><button class="tab" data-tab="emoji">
      <span class="tab-icon">😊</span>
      <span class="tab-label">Emoji</span>
    </button>
    <button class="tab" data-tab="colors">
      <span class="tab-icon">🎨</span>
      <span class="tab-label">Colors</span>
    </button>
    <button class="tab" data-tab="keyboard">
      <span class="tab-icon">⌨️</span>
      <span class="tab-label">Keyboard</span>
    </button>
  </div>

  <div id="display">
    <div id="digits-wrap"></div>
    <div id="native-edit" contenteditable="true" inputmode="text"
         enterkeyhint="enter" data-placeholder="Tap to type…"></div>
  </div>
  <div id="panels">
    <div id="panel-numbers" class="panel active">
      <div id="keyboard">
        <button class="key" data-n="1">1</button>
        <button class="key" data-n="2">2</button>
        <button class="key" data-n="3">3</button>
        <button class="key" data-n="4">4</button>
        <button class="key" data-n="5">5</button>
        <button class="key" data-n="6">6</button>
        <button class="key" data-n="7">7</button>
        <button class="key" data-n="8">8</button>
        <button class="key" data-n="9">9</button>
        <button class="key speech" id="speech-btn">🔊 On</button>
        <button class="key" data-n="0">0</button>
        <button class="key clear" style="grid-column: span 1;">✕ Clear</button>
      </div>
    </div>
    <div id="panel-letters" class="panel">
      <div id="keyboard-letters"></div>
    </div>
    <div id="panel-emoji" class="panel">

  const wrap = document.getElementById('digits-wrap');

  const MAX = 30;
  const speechSupported = 'speechSynthesis' in window;
  let speechEnabled = speechSupported && localStorage.getItem('speech-enabled') !== 'false';
  const speechBtn = document.getElementById('speech-btn');
  const synth = speechSupported ? window.speechSynthesis : null;

  // Eagerly trigger async voice loading so voices are ready before the first tap.
  // (onvoiceschanged is wired up inside the Settings block below.)
  if (synth) synth.getVoices();

  // ── Voice / TTS settings state ──
  const DEFAULT_RATE = 0.5, DEFAULT_PITCH = 1.2;
  function clampNum(v, min, max, fb){ return Number.isFinite(v) ? Math.min(max, Math.max(min, v)) : fb; }
  let speechRate     = clampNum(parseFloat(localStorage.getItem('speech-rate')),  0.3, 1.5, DEFAULT_RATE);
  let speechPitch    = clampNum(parseFloat(localStorage.getItem('speech-pitch')), 0.5, 2.0, DEFAULT_PITCH);
  let speechVoiceURI = localStorage.getItem('speech-voice') || '';   // '' = auto

  function getAvailableVoices(){ return synth ? synth.getVoices() : []; }
  // Resolve the SpeechSynthesisVoice to use, with graceful fallback.
  function resolveVoice(){
    const v = getAvailableVoices();
    if (!v.length) return null;
    if (speechVoiceURI){ const m = v.find(x => x.voiceURI === speechVoiceURI); if (m) return m; }
    return v.find(x => /^en[-_]US/i.test(x.lang)) || v.find(x => /^en/i.test(x.lang)) || v[0] || null;
  }

  function updateSpeechButton() {
    const lBtn = document.getElementById('letters-speech-btn');
    if (!speechSupported) {
      // Speech not available in this browser — disable both buttons.
      [speechBtn, lBtn].forEach(btn => {
        if (!btn) return;
        btn.textContent = btn === speechBtn ? '🔇 N/A' : '🔇';
        btn.classList.add('off');
        btn.disabled = true;
        btn.style.opacity = '0.4';
        btn.style.cursor = 'not-allowed';
      });
      return;
    }
    if (speechEnabled) {
      speechBtn.textContent = '🔊 On';
      speechBtn.classList.remove('off');
    } else {
      speechBtn.textContent = '🔇 Off';
      speechBtn.classList.add('off');
    }
    if (lBtn) {
      lBtn.textContent = speechEnabled ? '🔊' : '🔇';
      lBtn.classList.toggle('off', !speechEnabled);
    }
  }

  let speechTimer = null;
  function speak(text) {
    if (!speechEnabled || !synth) return;
    synth.cancel();
    clearTimeout(speechTimer);
    const utt = new SpeechSynthesisUtterance(('' + text).toLowerCase());
    utt.rate = speechRate;
    utt.pitch = speechPitch;
    const vc = resolveVoice();
    if (vc){ utt.voice = vc; utt.lang = vc.lang; }
    // Defer by one tick: Chrome silently drops speak() called synchronously
    // after cancel() when there was something in the queue.
    speechTimer = setTimeout(() => synth.speak(utt), 10);
  }

  function appendToWrap(el) {
    if (wrap.children.length >= MAX) wrap.removeChild(wrap.firstChild);
    wrap.appendChild(el);
  }

  function toggleSpeech() {
    if (!speechSupported) return;
    speechEnabled = !speechEnabled;
    localStorage.setItem('speech-enabled', speechEnabled);
    updateSpeechButton();
  }

  function addSpace() {
    const el = document.createElement('span');
    el.className = 'digit-char';
    el.textContent = '\u00A0';
    appendToWrap(el);
  }

  function addDigit(n) {
    const el = document.createElement('span');
    el.className = 'digit-char';
    el.textContent = n;
    appendToWrap(el);
    speak(n);
  }

  function clearAll() {
    wrap.innerHTML = '';
  }

  /** Remove the most recently typed character/square (physical Backspace). */
  function removeLast() {
    if (wrap.lastChild) wrap.removeChild(wrap.lastChild);
  }

  function spawnBurst(x, y) {
    const el = document.createElement('div');
    el.className = 'burst';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }

  function addRipple(btn, x, y) {
    const rect = btn.getBoundingClientRect();
    const ripple = document.createElement('span');
    ripple.className = 'ripple';
    const size = Math.max(rect.width, rect.height);
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = (x - rect.left - size / 2) + 'px';
    ripple.style.top = (y - rect.top - size / 2) + 'px';
    btn.appendChild(ripple);
    ripple.addEventListener('animationend', () => ripple.remove());
  }

  /**
   * Flash an on-screen key as if it had been tapped, bursting from its centre.
   * Used when the matching physical key is pressed.
   * @param {HTMLElement} btn  the on-screen key
   * @param {boolean} ripple   emoji keys aren't positioned/clipped, so they skip it
   */
  function flashKey(btn, ripple = true) {
    const rect = btn.getBoundingClientRect();
    const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
    if (ripple) addRipple(btn, cx, cy);
    spawnBurst(cx, cy);
    btn.classList.add('pressed');
    clearTimeout(btn._flashTimer);   // don't let an older flash cut a newer one short
    btn._flashTimer = setTimeout(() => btn.classList.remove('pressed'), 120);
  }

    toggleSpeech();

    clearBtn.className = 'lkey lkey-clear';
    clearBtn.textContent = 'clear';
    spaceRow.appendChild(clearBtn);
    kb.appendChild(spaceRow);

    kb.addEventListener('pointerdown', e => {
      const btn = e.target.closest('.lkey');

      addRipple(btn, e.clientX, e.clientY);

        return;
      }

        clearAll();
        return;
      }
      const ch = btn.dataset.char;
      if (ch === ' ') {
        addSpace();
      } else if (ch) {
        spawnBurst(e.clientX, e.clientY);
        addDigit(ch);
      }
    });
  })();

  (function() {

        const firstTouch = emojiSel < 0;
        if (firstTouch) setEmojiSel(0);

        if (k.startsWith('Arrow')) {

          else if (k === 'ArrowUp') {

            else { let j = i % cols; while (j + cols < n) j += cols; i = j; }

          if (!firstTouch) typeEmoji(emojiSel);
          return true;
        }

        if (k >= '0' && k <= '9') { addDigit(k); return true; }

        if (k.length === 1 && /[a-z]/i.test(k)) {
          const letter = k.toLowerCase();
          // Start after the current selection so the same letter cycles matches.
          for (let step = 1; step <= n; step++) {
            const i = (emojiSel + step) % n;
            if (buttons[i].dataset.name.toLowerCase().startsWith(letter)) {
              setEmojiSel(i);
              typeEmoji(i);
              break;
            }
          }
          return true;   // swallow unmatched letters rather than typing stray text
        }

        return false;
      }
    };
  })();

  // MARK: Colors
  // Add a color square to the display area
  function addColor(name, hex) {
    const el = document.createElement('span');
    el.className = 'color-char';
    el.style.backgroundColor = hex;
    el.style.boxShadow = '0 4px 20px ' + hex + '99';
    appendToWrap(el);
    speak(name);
  }

  // Build Colors keyboard
  (function() {
    const colorData = [
      { name: 'red',    hex: '#ff2020', text: '#fff' },
      { name: 'green',  hex: '#1ed44f', text: '#fff' },
      { name: 'blue',   hex: '#1a7fff', text: '#fff' },
      { name: 'yellow', hex: '#ffe033', text: '#333' },
      { name: 'white',  hex: '#f5f5f5', text: '#333' },
      { name: 'black',  hex: '#1a1a1a', text: '#fff' },
    ];
    const kb = document.getElementById('keyboard-colors');
    colorData.forEach(({ name, hex, text }) => {
      const btn = document.createElement('button');
      btn.className = 'ckey';
      btn.dataset.name = name;
      btn.dataset.hex = hex;
      // btn.textContent = name;
      btn.style.backgroundColor = hex;
      btn.style.color = text;
      if (name === 'black') {
        btn.style.border = '3px solid rgba(255,255,255,0.4)';
      }
      kb.appendChild(btn);
    });

    kb.addEventListener('pointerdown', ev => {
      const btn = ev.target.closest('.ckey');
      if (!btn) return;
      addRipple(btn, ev.clientX, ev.clientY);
      spawnBurst(ev.clientX, ev.clientY);
      addColor(btn.dataset.name, btn.dataset.hex);
    });
  })();

  // ── Physical keyboard support (tab-aware) ──
  const TAB_NAMES = ['numbers', 'letters', 'emoji', 'colors', 'keyboard'];
  // Colours keyed by first letter; 'b' is blue, so black gets 'k'.
  const COLOR_KEYS = { r: 'red', g: 'green', b: 'blue', y: 'yellow', w: 'white', k: 'black' };

  /** The on-screen key matching a typed character, if the active panel has one. */
  function keyButtonFor(tab, ch) {
    if (tab === 'numbers') return document.querySelector(`#keyboard .key[data-n="${ch}"]`);
    if (tab === 'letters') return document.querySelector(`#keyboard-letters .lkey[data-char="${ch}"]`);
    return null;
  }

  /** The colour key a physical key selects: 1–6 by position, or r/g/b/y/w/k by name. */
  function colorButtonFor(key) {
    const btns = document.querySelectorAll('#keyboard-colors .ckey');
    if (key >= '1' && key <= '6') return btns[+key - 1] || null;
    const name = COLOR_KEYS[key.toLowerCase()];
    return name ? [...btns].find(b => b.dataset.name === name) : null;
  }

  document.addEventListener('keydown', e => {
    const overlay = document.getElementById('settings-overlay');
    if (!overlay.hidden) {
      // Settings is open: Escape closes it, everything else stays native so the
      // sliders, select and close button remain keyboard-operable.
      if (e.key === 'Escape') { e.preventDefault(); overlay.hidden = true; }
      return;
    }

    const tab = document.querySelector('.tab.active')?.dataset.tab;
    const mod = e.ctrlKey || e.metaKey;

    // Tab shortcuts run before the Keyboard-tab bail-out, so it's never a trap.
    if (mod && !e.altKey) {
      if (e.key >= '1' && e.key <= '5') { e.preventDefault(); switchTab(TAB_NAMES[+e.key - 1]); return; }
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
        const i = TAB_NAMES.indexOf(tab);
        const step = e.key === 'ArrowRight' ? 1 : -1;
        switchTab(TAB_NAMES[(i + step + TAB_NAMES.length) % TAB_NAMES.length]);
        return;
      }
    }

    if (mod || e.altKey) return;      // leave every other browser chord alone
    if (tab === 'keyboard') return;   // the contenteditable owns its own typing

    if (e.key === 'Backspace') { e.preventDefault(); e.shiftKey ? clearAll() : removeLast(); return; }
    if (e.key === 'Delete')    { e.preventDefault(); removeLast(); return; }
    if (e.key === 'Escape')    { e.preventDefault(); clearAll(); return; }

    // Held keys would flood the display and the speech queue; arrows may repeat.
    if (e.repeat && !e.key.startsWith('Arrow')) return;

    if (tab === 'emoji') {
      if (emojiKeys && emojiKeys.handleKey(e)) e.preventDefault();
      return;
    }

    if (tab === 'colors') {
      const cbtn = colorButtonFor(e.key);
      if (cbtn) {
        e.preventDefault();
        flashKey(cbtn);
        addColor(cbtn.dataset.name, cbtn.dataset.hex);
        return;
      }
      // no colour for this key — fall through and type it as a character
    }

    if (e.key === ' ') {
      e.preventDefault();
      addSpace();
      const spaceBtn = keyButtonFor(tab, ' ');
      if (spaceBtn) flashKey(spaceBtn);
      return;
    }

    if (e.key.length === 1 && /[a-z0-9]/i.test(e.key)) {
      e.preventDefault();
      const ch = /[a-z]/i.test(e.key) ? e.key.toUpperCase() : e.key;
      addDigit(ch);
      const btn = keyButtonFor(tab, ch);
      if (btn) flashKey(btn);
    }
  });

  // Initialize speech button state
  updateSpeechButton();

  // Native keyboard tab elements
  const display = document.getElementById('display');
  const nativeEdit = document.getElementById('native-edit');

  // Move caret to end of the editable field
  function caretToEnd(el) {
    const range = document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // Tab bar switching
  function activateTab(tabName) {
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tabName));
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + tabName));
    const isKeyboard = tabName === 'keyboard';
    display.classList.toggle('native', isKeyboard);
    if (!isKeyboard) nativeEdit.blur();
  }

  /**
   * Switch tabs and remember the choice. Focusing #native-edit here keeps the
   * keyboard shortcut equivalent to tapping the tab.
   * @param {string} tabName
   */
  function switchTab(tabName) {
    activateTab(tabName);
    localStorage.setItem('active-tab', tabName);
    if (tabName === 'keyboard') {
      nativeEdit.focus();
      caretToEnd(nativeEdit);
    }
  }

  // Restore last active tab from localStorage
  const savedTab = localStorage.getItem('active-tab');
  if (savedTab && ['numbers', 'letters', 'emoji', 'colors', 'keyboard'].includes(savedTab)) {
    activateTab(savedTab);
  }

  document.getElementById('tab-bar').addEventListener('pointerdown', e => {
    const tab = e.target.closest('.tab');
    if (!tab) return;
    // Focus happens inside switchTab, still within this gesture, so the native
    // keyboard pops up on mobile.
    switchTab(tab.dataset.tab);
  });

  // Clear the native editable field
  document.getElementById('native-clear').addEventListener('pointerdown', e => {
    e.preventDefault();
    nativeEdit.innerHTML = '';
    nativeEdit.focus();
  });

  // Fallback: insert pasted images/GIFs inline (clipboard route — works where
  // the keyboard/OS copies the GIF to the clipboard, e.g. Firefox or desktop).
  nativeEdit.addEventListener('paste', e => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (const item of items) {
      if (item.type && item.type.startsWith('image/')) {
        e.preventDefault();
        const blob = item.getAsFile();
        if (!blob) continue;
        const img = document.createElement('img');
        img.src = URL.createObjectURL(blob);
        nativeEdit.focus();
        const sel = window.getSelection();
        if (sel && sel.rangeCount) {
          const range = sel.getRangeAt(0);
          range.deleteContents();
          range.insertNode(img);
          range.setStartAfter(img);
          range.collapse(true);
          sel.removeAllRanges();
          sel.addRange(range);
        } else {
          nativeEdit.appendChild(img);
        }
      }
    }
  });

  // ── Settings (parent-facing): voice, speed, pitch, speech on/off ──
  (function() {
    const overlay    = document.getElementById('settings-overlay');
    const gearBtn    = document.getElementById('gear-btn');
    const closeBtn   = document.getElementById('settings-close');
    const speechTog  = document.getElementById('set-speech');
    const voiceSel   = document.getElementById('set-voice');
    const rateInput  = document.getElementById('set-rate');
    const pitchInput = document.getElementById('set-pitch');
    const rateVal    = document.getElementById('set-rate-val');
    const pitchVal   = document.getElementById('set-pitch-val');
    const testBtn    = document.getElementById('set-test');

    function populateVoiceSelect() {
      if (!speechSupported) return;
      const voices = getAvailableVoices();
      voiceSel.innerHTML = '';
      const autoOpt = document.createElement('option');
      autoOpt.value = '';
      autoOpt.textContent = 'Auto (English)';
      voiceSel.appendChild(autoOpt);
      voices.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v.voiceURI;
        opt.textContent = `${v.name} (${v.lang})`;
        voiceSel.appendChild(opt);
      });
      // Reflect saved selection; if the saved voice is gone, fall back to Auto.
      const hasSaved = speechVoiceURI && voices.some(v => v.voiceURI === speechVoiceURI);
      voiceSel.value = hasSaved ? speechVoiceURI : '';
    }

    function syncSettingsUI() {
      speechTog.textContent = speechEnabled ? 'On' : 'Off';
      speechTog.classList.toggle('off', !speechEnabled);
      rateInput.value  = speechRate;  rateVal.textContent  = speechRate.toFixed(1);
      pitchInput.value = speechPitch; pitchVal.textContent = speechPitch.toFixed(1);
      if (!speechSupported) {
        [speechTog, voiceSel, rateInput, pitchInput, testBtn].forEach(el => el.disabled = true);
      }
    }

    function openSettings()  { populateVoiceSelect(); syncSettingsUI(); overlay.hidden = false; }
    function closeSettings() { overlay.hidden = true; }

    // Voices arrive asynchronously in Chrome — repopulate when they load.
    if (synth && typeof synth.onvoiceschanged !== 'undefined') {
      synth.onvoiceschanged = () => { synth.getVoices(); populateVoiceSelect(); };
    }

    // Gear: long-press (~600ms) to open — guards against accidental toddler taps.
    let holdTimer = null;
    gearBtn.addEventListener('pointerdown', e => {
      e.preventDefault();
      gearBtn.classList.add('holding');
      holdTimer = setTimeout(() => { gearBtn.classList.remove('holding'); openSettings(); }, 600);
    });
    const cancelHold = () => { clearTimeout(holdTimer); gearBtn.classList.remove('holding'); };
    gearBtn.addEventListener('pointerup', cancelHold);
    gearBtn.addEventListener('pointerleave', cancelHold);
    gearBtn.addEventListener('pointercancel', cancelHold);

    closeBtn.addEventListener('pointerdown', e => { e.preventDefault(); closeSettings(); });
    // Tap the dimmed backdrop (but not the panel) to close.
    overlay.addEventListener('pointerdown', e => { if (e.target === overlay) closeSettings(); });

    // Speech on/off — reuse the shared toggle so keyboard buttons stay in sync.
    speechTog.addEventListener('pointerdown', e => {
      e.preventDefault();
      toggleSpeech();
      syncSettingsUI();
    });

    voiceSel.addEventListener('change', () => {
      speechVoiceURI = voiceSel.value;
      localStorage.setItem('speech-voice', speechVoiceURI);
    });

    rateInput.addEventListener('input', () => {
      speechRate = parseFloat(rateInput.value);
      rateVal.textContent = speechRate.toFixed(1);
      localStorage.setItem('speech-rate', speechRate);
    });

    pitchInput.addEventListener('input', () => {
      speechPitch = parseFloat(pitchInput.value);
      pitchVal.textContent = speechPitch.toFixed(1);
      localStorage.setItem('speech-pitch', speechPitch);
    });

    // Test button — the only auditioning control; speaks even when speech is off.
    testBtn.addEventListener('pointerdown', e => {
      e.preventDefault();
      if (!speechEnabled) { toggleSpeech(); syncSettingsUI(); }
      speak('hello');
    });
  })();

  // Register service worker for offline / PWA install
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then(registration => {
      registration.update();
    });
  }
</script>
</body>
</html>
