<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f0a1e" />
  <title>Vehicle World</title>
  <link rel="manifest" href="manifest.json" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { overflow: hidden; height: 100%; user-select: none; -webkit-user-select: none; }
    body { background: #0f0a1e; font-family: 'Fredoka One', system-ui, sans-serif; }
    #app { position: fixed; inset: 0; }
    .screen { position: absolute; inset: 0; display: none; }
    .screen.active { display: block; }
    #gridScreen.active { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: 1.6vmin; padding: 1.6vmin; padding-top: calc(1.6vmin + env(safe-area-inset-top)); }
    .card { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.5vmin; min-width: 0; min-height: 0; overflow: hidden; border-radius: 14px; background: #1a1332; border: 2px solid var(--c); box-shadow: 0 0 10px color-mix(in srgb, var(--c) 60%, transparent); touch-action: manipulation; cursor: pointer; transition: transform 0.1s; }
    .card.pressed { transform: scale(0.92); }
    .card .em { font-size: clamp(26px, 7vmin, 56px); line-height: 1; }
    .card .nm { color: var(--c); font-size: clamp(16px, 2.4vmin, 19px); text-align: center; line-height: 1.05; padding: 0 2px; overflow-wrap: anywhere; }
    #viewerScreen { background: radial-gradient(ellipse at 50% 35%, #241b47 0%, #0f0a1e 70%); }
    #c3d { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
    .rbtn { position: absolute; width: clamp(72px, 13vmin, 104px); height: clamp(72px, 13vmin, 104px); border-radius: 50%; border: 3px solid var(--c, #7bdff2); background: #1a1332; color: var(--c, #7bdff2); font-size: clamp(28px, 6vmin, 48px); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 12px color-mix(in srgb, var(--c, #7bdff2) 60%, transparent); touch-action: manipulation; cursor: pointer; transition: transform 0.1s; z-index: 2; }
    .rbtn.pressed { transform: scale(0.92); }
    #backBtn { top: calc(12px + env(safe-area-inset-top)); left: 12px; --c: #ff9f1c; }
    #prevBtn { left: 8px; top: 50%; transform: translateY(-50%); --c: #7bdff2; }
    #nextBtn { right: 8px; top: 50%; transform: translateY(-50%); --c: #7bdff2; }
    #prevBtn.pressed { transform: translateY(-50%) scale(0.92); }
    #nextBtn.pressed { transform: translateY(-50%) scale(0.92); }
    #engineBtn { bottom: calc(16px + env(safe-area-inset-bottom)); right: 16px; --c: #ff4d6d; width: clamp(96px, 16vmin, 128px); height: clamp(96px, 16vmin, 128px); }
    #lightsBtn { bottom: calc(16px + env(safe-area-inset-bottom)); left: 16px; --c: #ffe74c; width: clamp(96px, 16vmin, 128px); height: clamp(96px, 16vmin, 128px); }
    #nameLbl { position: absolute; top: calc(14px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); color: #fff; font-size: clamp(28px, 6vmin, 52px); text-shadow: 0 0 14px var(--c, #fff); touch-action: manipulation; cursor: pointer; z-index: 2; transition: transform 0.1s; white-space: nowrap; }
    #nameLbl.pressed { transform: translateX(-50%) scale(0.92); }
    @keyframes pump { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
    #engineBtn.on { animation: pump 0.5s infinite; }
    #lightsBtn.on { background: #ffe74c; color: #0f0a1e; box-shadow: 0 0 28px #ffe74c; }
  </style>
</head>
<body>
  <div id="app">
    <section id="gridScreen" class="screen active"></section>
    <section id="viewerScreen" class="screen">
      <canvas id="c3d"></canvas>
      <div id="nameLbl"></div>
      <div class="rbtn" id="backBtn">↩</div>
      <div class="rbtn" id="prevBtn">◀</div>
      <div class="rbtn" id="nextBtn">▶</div>
      <div class="rbtn" id="engineBtn">🔊</div>
      <div class="rbtn" id="lightsBtn">💡</div>
    </section>
  </div>
  <script type="importmap">
    { "imports": { "three": "./lib/three.module.min.js" } }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from './lib/GLTFLoader.js';
    const P = ['#ff4d6d','#ff9f1c','#2ec4b6','#c77dff','#f72585','#7bdff2','#ffe74c','#6aff6a','#a8dadc','#b2f7ef'];
    const VEHICLES = [
      { id: 'bus',         name: 'Bus',          emoji: '🚌', recipe: 'diesel', rot: Math.PI / 2 },
      { id: 'truck',       name: 'Truck',        emoji: '🚚', recipe: 'diesel' },
      { id: 'towtruck',    name: 'Tow Truck',    emoji: '🛻', recipe: 'diesel' },
      { id: 'firetruck',   name: 'Fire Truck',   emoji: '🚒', recipe: 'diesel' },
      { id: 'ambulance',   name: 'Ambulance',    emoji: '🚑', recipe: 'diesel' },
      { id: 'van',         name: 'Van',          emoji: '🚐', recipe: 'diesel' },
      { id: 'cementmixer', name: 'Cement Mixer', emoji: '🌀', recipe: 'diesel' },
      { id: 'tractor',     name: 'Tractor',      emoji: '🚜', recipe: 'heavyDiesel' },
      { id: 'excavator',   name: 'Excavator',    emoji: '⛏️', recipe: 'heavyDiesel' },
      { id: 'digger',      name: 'Digger',       emoji: '🚧', recipe: 'heavyDiesel' },
      { id: 'crane',       name: 'Crane',        emoji: '🏗️', recipe: 'heavyDiesel' },
      { id: 'roadroller',  name: 'Road Roller',  emoji: '🛞', recipe: 'heavyDiesel' },
      { id: 'train',       name: 'Train',        emoji: '🚂', recipe: 'train' },
      { id: 'metro',       name: 'Metro',        emoji: '🚇', recipe: 'electric' },
      { id: 'rickshaw',    name: 'Auto Rickshaw', emoji: '🛺', recipe: 'putt' },
      { id: 'boat',        name: 'Boat',         emoji: '⛵', recipe: 'boat' },
      { id: 'helicopter',  name: 'Helicopter',   emoji: '🚁', recipe: 'helicopter' },
      { id: 'jeep',        name: 'Jeep',         emoji: '🚙', recipe: 'petrol' },
      { id: 'suv',         name: 'SUV',          speechName: 'S U V', emoji: '🚘', recipe: 'petrol' },
      { id: 'sedan',       name: 'Sedan',        emoji: '🚗', recipe: 'petrol' },
      { id: 'coupe',       name: 'Coupe',        emoji: '🏎️', recipe: 'petrol' },
      { id: 'hatchback',   name: 'Hatchback',    emoji: '🚕', recipe: 'petrol' },
      { id: 'vintage',     name: 'Vintage Car',  emoji: '🚗', recipe: 'petrol' }
    ];
    VEHICLES.forEach((v, i) => { v.color = P[i % P.length]; });
    /* ===== AUDIO ===== */
    let audioCtx = null;
    function ensureAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }
    function popTone() {
      const ctx = ensureAudio(), t = ctx.currentTime;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(600, t);
      o.frequency.exponentialRampToValueAtTime(900, t + 0.1);
      g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
      o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + 0.16);
    }
    /* ===== SPEECH ===== */
    /* ===== GRID ===== */
    const gridEl = document.getElementById('gridScreen');
    VEHICLES.forEach((v, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.style.setProperty('--c', v.color);
      card.innerHTML = `<div class="em">${v.emoji}</div><div class="nm">${v.name}</div>`;
      card.addEventListener('pointerdown', () => {
        card.classList.add('pressed');
        popTone();
        setTimeout(() => { card.classList.remove('pressed'); openVehicle(i); }, 120);
      });
      gridEl.appendChild(card);
    });
    /* ===== VIEWER ===== */
    const canvas = document.getElementById('c3d');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 50);
    camera.position.set(0, 1.5, 4.4);
    camera.lookAt(0, 0.7, 0);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x223355, 1.4));
    const sun = new THREE.DirectionalLight(0xffffff, 2.0);
    sun.position.set(3, 5, 2);
    scene.add(sun);
    const pivot = new THREE.Group();   // pitch (rotation.x)
    const spinner = new THREE.Group(); // yaw (rotation.y); models + light rig live here
    pivot.add(spinner);
    scene.add(pivot);
    const frameHooks = [];

    /* ===== ROTATION: drag, keyboard, idle auto-spin ===== */
    let yawVel = 0, autoSpin = true, idleTimer = null;
    const PITCH_MAX = 0.55;
    function markInteract() {
      autoSpin = false;
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => { autoSpin = true; }, 3000);
    }
    let dragId = null, lastX = 0, lastY = 0;
    canvas.addEventListener('pointerdown', (e) => {
      dragId = e.pointerId; lastX = e.clientX; lastY = e.clientY;
      canvas.setPointerCapture(e.pointerId);
      markInteract();
    });
    canvas.addEventListener('pointermove', (e) => {
      if (e.pointerId !== dragId) return;
      spinner.rotation.y += (e.clientX - lastX) * 0.012;
      pivot.rotation.x = Math.max(-PITCH_MAX, Math.min(PITCH_MAX, pivot.rotation.x + (e.clientY - lastY) * 0.008));
      lastX = e.clientX; lastY = e.clientY;
      markInteract();
    });
    canvas.addEventListener('pointerup', () => { dragId = null; });
    canvas.addEventListener('pointercancel', () => { dragId = null; });
    addEventListener('keydown', (e) => {
      if (!viewerActive) return;
      const k = e.key;
      if (k === 'ArrowLeft') spinner.rotation.y -= 0.09;
      else if (k === 'ArrowRight') spinner.rotation.y += 0.09;
      else if (k === 'ArrowUp') pivot.rotation.x = Math.max(-PITCH_MAX, pivot.rotation.x - 0.05);
      else if (k === 'ArrowDown') pivot.rotation.x = Math.min(PITCH_MAX, pivot.rotation.x + 0.05);
      else return;
      e.preventDefault();
      markInteract();
    });
    frameHooks.push((dt) => { if (autoSpin) spinner.rotation.y += dt * 0.35; });

    const loader = new GLTFLoader();
    const modelCache = new Map();

    const TARGET_HEIGHT = 1.5; // cap vertical extent so tall/thin models (crane, boat mast) clear the name label
    function normalize(sceneRoot, rot = 0) {
      const inner = new THREE.Group();
      sceneRoot.rotation.y = rot;
      inner.add(sceneRoot);
      let box = new THREE.Box3().setFromObject(inner);
      const size = box.getSize(new THREE.Vector3());
      inner.scale.setScalar(Math.min(2 / Math.max(size.x, size.y, size.z), TARGET_HEIGHT / size.y));
      box = new THREE.Box3().setFromObject(inner);
      const c = box.getCenter(new THREE.Vector3());
      inner.position.set(-c.x, -box.min.y, -c.z);
      const g = new THREE.Group();
      g.add(inner);
      g.userData.bbox = new THREE.Box3().setFromObject(inner);
      return g;
    }

    function emojiSprite(emoji) {
      const cv = document.createElement('canvas'); cv.width = cv.height = 256;
      const x = cv.getContext('2d');
      x.font = '200px serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
      x.fillText(emoji, 128, 140);
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), transparent: true }));
      sp.scale.setScalar(2); sp.position.y = 1;
      const g = new THREE.Group(); g.add(sp);
      g.userData.bbox = new THREE.Box3(new THREE.Vector3(-1, 0, -0.5), new THREE.Vector3(1, 1.6, 0.5));
      return g;
    }

    /* ===== PROCEDURAL VEHICLES (no CC0 model exists for these five) ===== */
    function mesh(geo, color) {
      return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color }));
    }
    function wheel(radius, width, color = 0x1a1a2e) {
      const w = mesh(new THREE.CylinderGeometry(radius, radius, width, 16), color);
      w.rotation.z = Math.PI / 2;
      return w;
    }

    function buildTowTruck() {
      const g = new THREE.Group();
      const cabColor = 0xff9f1c, bedColor = 0xe05d1c, metal = 0x777788, glass = 0x1b3a5c, dark = 0x1a1a2e;
      const chassis = mesh(new THREE.BoxGeometry(1.0, 0.3, 2.5), bedColor);
      chassis.position.set(0, 0.5, -0.1);
      g.add(chassis);
      const cab = mesh(new THREE.BoxGeometry(0.95, 0.6, 0.9), cabColor);
      cab.position.set(0, 0.95, 0.75);
      g.add(cab);
      const windshield = mesh(new THREE.BoxGeometry(0.82, 0.32, 0.1), glass);
      windshield.position.set(0, 1.05, 1.18);
      g.add(windshield);
      const bedFloor = mesh(new THREE.BoxGeometry(0.96, 0.15, 1.3), bedColor);
      bedFloor.position.set(0, 0.72, -0.55);
      g.add(bedFloor);
      const bedWallL = mesh(new THREE.BoxGeometry(0.1, 0.35, 1.3), bedColor);
      bedWallL.position.set(-0.45, 0.9, -0.55);
      g.add(bedWallL);
      const bedWallR = bedWallL.clone();
      bedWallR.position.x = 0.45;
      g.add(bedWallR);
      // goalpost-style hoist: two posts + crossbar + chain + hanging hook, all rigidly stacked
      const postL = mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.75, 8), metal);
      postL.position.set(-0.35, 1.28, -1.1);
      g.add(postL);
      const postR = postL.clone();
      postR.position.x = 0.35;
      g.add(postR);
      const crossbar = mesh(new THREE.BoxGeometry(0.84, 0.1, 0.1), metal);
      crossbar.position.set(0, 1.63, -1.1);
      g.add(crossbar);
      const chain = mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.35, 6), dark);
      chain.position.set(0, 1.4, -1.1);
      g.add(chain);
      const hook = mesh(new THREE.TorusGeometry(0.13, 0.04, 8, 16), dark);
      hook.position.set(0, 1.15, -1.1);
      g.add(hook);
      [[-0.53, 0.34, 0.7], [0.53, 0.34, 0.7], [-0.53, 0.34, -0.75], [0.53, 0.34, -0.75]].forEach(([x, y, z]) => {
        const w = wheel(0.34, 0.26);
        w.position.set(x, y, z);
        g.add(w);
      });
      return g;
    }

    function buildExcavator() {
      const g = new THREE.Group();
      const yellow = 0xffb703, dark = 0x22252b, metal = 0xffb703, teeth = 0x333344, glass = 0x1b3a5c;
      const track = mesh(new THREE.BoxGeometry(1.1, 0.35, 2.0), dark);
      track.position.y = 0.2;
      g.add(track);
      [-0.7, 0, 0.7].forEach(z => {
        [-0.55, 0.55].forEach(x => {
          const wh = wheel(0.2, 0.15, 0x111116);
          wh.position.set(x, 0.2, z);
          g.add(wh);
        });
      });
      const turretBase = mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.15, 12), yellow);
      turretBase.position.set(0, 0.45, 0);
      g.add(turretBase);
      const cab = mesh(new THREE.BoxGeometry(0.9, 0.55, 1.1), yellow);
      cab.position.set(0.05, 0.8, -0.1);
      cab.rotation.y = 0.4;
      g.add(cab);
      const cabGlass = mesh(new THREE.BoxGeometry(0.5, 0.35, 0.08), glass);
      cabGlass.position.set(0.35, 0.85, 0.45);
      cabGlass.rotation.y = 0.4;
      g.add(cabGlass);
      // boom: shoulder pivot -> elbow -> wrist -> bucket, chained so segments meet
      const shoulder = new THREE.Vector3(0.05, 0.95, 0.35);
      const boomDir = new THREE.Vector3(0, Math.sin(0.7), Math.cos(0.7));
      const boomLen = 1.1;
      const boom = mesh(new THREE.BoxGeometry(0.22, 0.22, boomLen), metal);
      boom.position.copy(shoulder).addScaledVector(boomDir, boomLen / 2);
      boom.rotation.x = -0.7;
      g.add(boom);
      const elbow = shoulder.clone().addScaledVector(boomDir, boomLen);
      const stickDir = new THREE.Vector3(0, -Math.sin(1.0), Math.cos(1.0));
      const stickLen = 0.85;
      const stick = mesh(new THREE.BoxGeometry(0.16, 0.16, stickLen), metal);
      stick.position.copy(elbow).addScaledVector(stickDir, stickLen / 2);
      stick.rotation.x = 1.0;
      g.add(stick);
      const wrist = elbow.clone().addScaledVector(stickDir, stickLen);
      const bucketDir = new THREE.Vector3(0, -Math.sin(1.4), Math.cos(1.4));
      const bucket = mesh(new THREE.BoxGeometry(0.42, 0.32, 0.36), dark);
      bucket.position.copy(wrist).addScaledVector(bucketDir, 0.18);
      bucket.rotation.x = 1.4;
      g.add(bucket);
      const bucketTip = wrist.clone().addScaledVector(bucketDir, 0.36);
      [-0.14, 0, 0.14].forEach(dx => {
        const tooth = mesh(new THREE.ConeGeometry(0.05, 0.16, 4), teeth);
        tooth.position.set(bucketTip.x + dx, bucketTip.y, bucketTip.z);
        tooth.rotation.x = 1.4 + Math.PI / 2;
        g.add(tooth);
      });
      return g;
    }

    function buildDigger() {
      const g = new THREE.Group();
      const yellow = 0xffb703, dark = 0x22252b, metal = 0x777788, glass = 0x1b3a5c, blade = 0xffe74c;
      const track = mesh(new THREE.BoxGeometry(1.1, 0.36, 2.0), dark);
      track.position.y = 0.2;
      g.add(track);
      [-0.7, 0, 0.7].forEach(z => {
        [-0.56, 0.56].forEach(x => {
          const wh = wheel(0.2, 0.16, 0x111116);
          wh.position.set(x, 0.2, z);
          g.add(wh);
        });
      });
      const body = mesh(new THREE.BoxGeometry(0.95, 0.5, 1.6), yellow);
      body.position.set(0, 0.63, -0.1);
      g.add(body);
      const cab = mesh(new THREE.BoxGeometry(0.7, 0.5, 0.7), yellow);
      cab.position.set(0, 1.13, -0.45);
      g.add(cab);
      const cabGlass = mesh(new THREE.BoxGeometry(0.72, 0.3, 0.72), glass);
      cabGlass.position.set(0, 1.2, -0.45);
      g.add(cabGlass);
      const stack = mesh(new THREE.CylinderGeometry(0.06, 0.07, 0.45, 8), dark);
      stack.position.set(0.3, 1.25, 0.1);
      g.add(stack);
      const armL = mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.4, 6), metal);
      armL.rotation.x = Math.PI / 2;
      armL.position.set(-0.35, 0.5, 0.9);
      g.add(armL);
      const armR = armL.clone();
      armR.position.x = 0.35;
      g.add(armR);
      const bladeMesh = mesh(new THREE.BoxGeometry(1.3, 0.55, 0.15), blade);
      bladeMesh.position.set(0, 0.5, 1.1);
      bladeMesh.rotation.x = -0.15;
      g.add(bladeMesh);
      return g;
    }

    function buildRoadRoller() {
      const g = new THREE.Group();
      const bodyColor = 0xff4d6d, drumColor = 0xced4da, glass = 0x1b3a5c;
      const drum = mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.9, 20), drumColor);
      drum.rotation.z = Math.PI / 2;
      drum.position.set(0, 0.55, 0.85);
      g.add(drum);
      const frame = mesh(new THREE.BoxGeometry(0.5, 0.25, 1.6), bodyColor);
      frame.position.set(0, 0.55, -0.1);
      g.add(frame);
      const body = mesh(new THREE.BoxGeometry(0.85, 0.45, 1.1), bodyColor);
      body.position.set(0, 0.85, -0.4);
      g.add(body);
      const cab = mesh(new THREE.BoxGeometry(0.7, 0.5, 0.55), bodyColor);
      cab.position.set(0, 1.3, -0.6);
      g.add(cab);
      const cabGlass = mesh(new THREE.BoxGeometry(0.72, 0.32, 0.57), glass);
      cabGlass.position.set(0, 1.32, -0.6);
      g.add(cabGlass);
      const rearWheelL = wheel(0.32, 0.24);
      rearWheelL.position.set(-0.42, 0.32, -0.9);
      g.add(rearWheelL);
      const rearWheelR = rearWheelL.clone();
      rearWheelR.position.x = 0.42;
      g.add(rearWheelR);
      return g;
    }

    function buildRickshaw() {
      const g = new THREE.Group();
      const bodyColor = 0xffe74c, canopyColor = 0x2ec4b6, dark = 0x1a1a2e;
      const floor = mesh(new THREE.BoxGeometry(0.85, 0.12, 1.1), bodyColor);
      floor.position.set(0, 0.45, -0.15);
      g.add(floor);
      const wallL = mesh(new THREE.BoxGeometry(0.08, 0.5, 1.1), bodyColor);
      wallL.position.set(-0.42, 0.7, -0.15);
      g.add(wallL);
      const wallR = wallL.clone();
      wallR.position.x = 0.42;
      g.add(wallR);
      const seatBack = mesh(new THREE.BoxGeometry(0.85, 0.55, 0.12), bodyColor);
      seatBack.position.set(0, 0.75, -0.65);
      g.add(seatBack);
      const canopy = mesh(new THREE.BoxGeometry(0.95, 0.08, 1.2), canopyColor);
      canopy.position.set(0, 1.15, -0.15);
      g.add(canopy);
      [[-0.42, -0.6], [0.42, -0.6], [-0.42, 0.35], [0.42, 0.35]].forEach(([x, z]) => {
        const pillar = mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.7, 6), dark);
        pillar.position.set(x, 0.8, z);
        g.add(pillar);
      });
      const frontFork = mesh(new THREE.BoxGeometry(0.08, 0.12, 0.08), dark);
      frontFork.position.set(0, 0.36, 0.6);
      g.add(frontFork);
      const headlight = mesh(new THREE.BoxGeometry(0.22, 0.14, 0.08), bodyColor);
      headlight.position.set(0, 0.55, 0.55);
      g.add(headlight);
      const frontWheel = wheel(0.26, 0.15);
      frontWheel.position.set(0, 0.26, 0.66);
      g.add(frontWheel);
      const rearWheelL = wheel(0.26, 0.18);
      rearWheelL.position.set(-0.42, 0.26, -0.65);
      g.add(rearWheelL);
      const rearWheelR = rearWheelL.clone();
      rearWheelR.position.x = 0.42;
      g.add(rearWheelR);
      return g;
    }

    const BUILDERS = {
      towtruck: buildTowTruck,
      excavator: buildExcavator,
      digger: buildDigger,
      roadroller: buildRoadRoller,
      rickshaw: buildRickshaw
    };

    function blobShadow() {
      const cv = document.createElement('canvas'); cv.width = cv.height = 128;
      const x = cv.getContext('2d');
      const gr = x.createRadialGradient(64, 64, 8, 64, 64, 64);
      gr.addColorStop(0, 'rgba(0,0,0,0.45)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
      x.fillStyle = gr; x.fillRect(0, 0, 128, 128);
      const m = new THREE.Mesh(
        new THREE.PlaneGeometry(3.2, 3.2),
        new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cv), transparent: true, depthWrite: false })
      );
      m.rotation.x = -Math.PI / 2; m.position.y = 0.01;
      return m;
    }
    spinner.add(blobShadow());

    let modelRoot = null, entranceT = 1, loadSeq = 0;
    function easeOutBack(t) { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
    frameHooks.push(() => {
      if (modelRoot && entranceT < 1) {
        entranceT = Math.min(entranceT + 1 / 30, 1);
        modelRoot.scale.setScalar(Math.max(easeOutBack(entranceT), 0.001));
      }
    });

    async function showModel(v) {
      const seq = ++loadSeq;
      if (modelRoot) { spinner.remove(modelRoot); modelRoot = null; }
      let g = modelCache.get(v.id);
      if (!g && BUILDERS[v.id]) {
        g = normalize(BUILDERS[v.id](), v.rot || 0); // synchronous, cannot fail: cache like a successful load
        modelCache.set(v.id, g);
      } else if (!g) {
        try {
          const gltf = await loader.loadAsync(`models/${v.id}.glb`);
          g = normalize(gltf.scene, v.rot || 0);
          modelCache.set(v.id, g); // only cache successful loads; let failures retry next open
        } catch (e) {
          console.warn('model failed', v.id, e);
          g = emojiSprite(v.emoji);
        }
      }
      if (seq !== loadSeq) return; // user already moved on
      modelRoot = g;
      entranceT = 0;
      modelRoot.scale.setScalar(0.001);
      spinner.add(modelRoot);
    }

    function resize() {
      const w = innerWidth, h = innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    addEventListener('resize', resize);

    let rafId = null, lastT = 0, viewerActive = false;
    function frame(t) {
      rafId = null;
      if (!viewerActive || document.hidden) return;
      const dt = Math.min((t - lastT) / 1000, 0.05); lastT = t;
      frameHooks.forEach(fn => fn(dt));
      renderer.render(scene, camera);
      rafId = requestAnimationFrame(frame);
    }
    function startLoop() { if (!rafId) { lastT = performance.now(); rafId = requestAnimationFrame(frame); } }
    document.addEventListener('visibilitychange', () => { if (!document.hidden) startLoop(); });

    let current = 0;
    function openVehicle(i) {
      current = (i + VEHICLES.length) % VEHICLES.length;
      const v = VEHICLES[current];
      const lbl = document.getElementById('nameLbl');
      lbl.textContent = v.name;
      lbl.style.setProperty('--c', v.color);
      showScreen('viewerScreen');
      viewerActive = true;
      resize();
      startLoop();
      showModel(v);
      spinner.rotation.y = -0.6; pivot.rotation.x = 0.15;
      autoSpin = false; markInteract();
      // Task 9 adds: speak(v). Task 10 adds: lightsOff().
    }
    function closeViewer() {
      viewerActive = false;
      showScreen('gridScreen');
    }
    function bindBtn(id, fn) {
      const el = document.getElementById(id);
      el.addEventListener('pointerdown', () => {
        el.classList.add('pressed');
        setTimeout(() => el.classList.remove('pressed'), 120);
        fn();
      });
    }
    bindBtn('backBtn', () => { popTone(); closeViewer(); });
    bindBtn('prevBtn', () => { popTone(); openVehicle(current - 1); });
    bindBtn('nextBtn', () => { popTone(); openVehicle(current + 1); });

    window.showScreen = (id) => {
      document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
    };
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then(r => r.update());
    }
  </script>
</body>
</html>
