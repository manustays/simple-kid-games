<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f0a1e" />
  <title>Vehicle World</title>
  <link rel="manifest" href="manifest.json" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { overflow: hidden; height: 100%; user-select: none; -webkit-user-select: none; }
    body { background: #0f0a1e; font-family: 'Fredoka One', system-ui, sans-serif; }
    #app { position: fixed; inset: 0; }
    .screen { position: absolute; inset: 0; display: none; }
    .screen.active { display: block; }
    #gridScreen.active { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: 1.6vmin; padding: 1.6vmin; padding-top: calc(1.6vmin + env(safe-area-inset-top)); }
    .card { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.5vmin; min-width: 0; min-height: 0; overflow: hidden; border-radius: 14px; background: #1a1332; border: 2px solid var(--c); box-shadow: 0 0 10px color-mix(in srgb, var(--c) 60%, transparent); touch-action: manipulation; cursor: pointer; transition: transform 0.1s; }
    .card.pressed { transform: scale(0.92); }
    .card .em { font-size: clamp(26px, 7vmin, 56px); line-height: 1; }
    .card .nm { color: var(--c); font-size: clamp(16px, 2.4vmin, 19px); text-align: center; line-height: 1.05; padding: 0 2px; overflow-wrap: anywhere; }
    #viewerScreen { background: radial-gradient(ellipse at 50% 35%, #241b47 0%, #0f0a1e 70%); }
    #c3d { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
    .rbtn { position: absolute; width: clamp(72px, 13vmin, 104px); height: clamp(72px, 13vmin, 104px); border-radius: 50%; border: 3px solid var(--c, #7bdff2); background: #1a1332; color: var(--c, #7bdff2); font-size: clamp(28px, 6vmin, 48px); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 12px color-mix(in srgb, var(--c, #7bdff2) 60%, transparent); touch-action: manipulation; cursor: pointer; transition: transform 0.1s; z-index: 2; }
    .rbtn.pressed { transform: scale(0.92); }
    #backBtn { top: calc(12px + env(safe-area-inset-top)); left: 12px; --c: #ff9f1c; }
    #prevBtn { left: 8px; top: 50%; transform: translateY(-50%); --c: #7bdff2; }
    #nextBtn { right: 8px; top: 50%; transform: translateY(-50%); --c: #7bdff2; }
    #prevBtn.pressed { transform: translateY(-50%) scale(0.92); }
    #nextBtn.pressed { transform: translateY(-50%) scale(0.92); }
    #engineBtn { bottom: calc(16px + env(safe-area-inset-bottom)); right: 16px; --c: #ff4d6d; width: clamp(96px, 16vmin, 128px); height: clamp(96px, 16vmin, 128px); }
    #lightsBtn { bottom: calc(16px + env(safe-area-inset-bottom)); left: 16px; --c: #ffe74c; width: clamp(96px, 16vmin, 128px); height: clamp(96px, 16vmin, 128px); }
    #nameLbl { position: absolute; top: calc(14px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); color: #fff; font-size: clamp(28px, 6vmin, 52px); text-shadow: 0 0 14px var(--c, #fff); touch-action: manipulation; cursor: pointer; z-index: 2; transition: transform 0.1s; white-space: nowrap; }
    #nameLbl.pressed { transform: translateX(-50%) scale(0.92); }
    @keyframes pump { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
    #engineBtn.on { animation: pump 0.5s infinite; }
    #lightsBtn.on { background: #ffe74c; color: #0f0a1e; box-shadow: 0 0 28px #ffe74c; }
  </style>
</head>
<body>
  <div id="app">
    <section id="gridScreen" class="screen active"></section>
    <section id="viewerScreen" class="screen">
      <canvas id="c3d"></canvas>
      <div id="nameLbl"></div>
      <div class="rbtn" id="backBtn">↩</div>
      <div class="rbtn" id="prevBtn">◀</div>
      <div class="rbtn" id="nextBtn">▶</div>
      <div class="rbtn" id="engineBtn">🔊</div>
      <div class="rbtn" id="lightsBtn">💡</div>
    </section>
  </div>
  <script type="importmap">
    { "imports": { "three": "./lib/three.module.min.js" } }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from './lib/GLTFLoader.js';
    const P = ['#ff4d6d','#ff9f1c','#2ec4b6','#c77dff','#f72585','#7bdff2','#ffe74c','#6aff6a','#a8dadc','#b2f7ef'];
    const VEHICLES = [
      { id: 'bus',         name: 'Bus',          emoji: '🚌', recipe: 'diesel', rot: Math.PI / 2 },
      { id: 'truck',       name: 'Truck',        emoji: '🚚', recipe: 'diesel' },
      { id: 'towtruck',    name: 'Tow Truck',    emoji: '🛻', recipe: 'diesel' },
      { id: 'firetruck',   name: 'Fire Truck',   emoji: '🚒', recipe: 'diesel' },
      { id: 'ambulance',   name: 'Ambulance',    emoji: '🚑', recipe: 'diesel' },
      { id: 'van',         name: 'Van',          emoji: '🚐', recipe: 'diesel' },
      { id: 'cementmixer', name: 'Cement Mixer', emoji: '🌀', recipe: 'diesel' },
      { id: 'tractor',     name: 'Tractor',      emoji: '🚜', recipe: 'heavyDiesel' },
      { id: 'excavator',   name: 'Excavator',    emoji: '⛏️', recipe: 'heavyDiesel' },
      { id: 'digger',      name: 'Digger',       emoji: '🚧', recipe: 'heavyDiesel' },
      { id: 'crane',       name: 'Crane',        emoji: '🏗️', recipe: 'heavyDiesel' },
      { id: 'roadroller',  name: 'Road Roller',  emoji: '🛞', recipe: 'heavyDiesel' },
      { id: 'train',       name: 'Train',        emoji: '🚂', recipe: 'train' },
      { id: 'metro',       name: 'Metro',        emoji: '🚇', recipe: 'electric' },
      { id: 'rickshaw',    name: 'Auto Rickshaw', emoji: '🛺', recipe: 'putt' },
      { id: 'boat',        name: 'Boat',         emoji: '⛵', recipe: 'boat' },
      { id: 'helicopter',  name: 'Helicopter',   emoji: '🚁', recipe: 'helicopter' },
      { id: 'jeep',        name: 'Jeep',         emoji: '🚙', recipe: 'petrol' },
      { id: 'suv',         name: 'SUV',          speechName: 'S U V', emoji: '🚘', recipe: 'petrol' },
      { id: 'sedan',       name: 'Sedan',        emoji: '🚗', recipe: 'petrol' },
      { id: 'coupe',       name: 'Coupe',        emoji: '🏎️', recipe: 'petrol' },
      { id: 'hatchback',   name: 'Hatchback',    emoji: '🚕', recipe: 'petrol' },
      { id: 'vintage',     name: 'Vintage Car',  emoji: '🚗', recipe: 'petrol' }
    ];
    VEHICLES.forEach((v, i) => { v.color = P[i % P.length]; });
    /* ===== AUDIO ===== */
    let audioCtx = null;
    function ensureAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }
    function popTone() {
      const ctx = ensureAudio(), t = ctx.currentTime;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(600, t);
      o.frequency.exponentialRampToValueAtTime(900, t + 0.1);
      g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
      o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + 0.16);
    }
    /* ===== SPEECH ===== */
    /* ===== GRID ===== */
    const gridEl = document.getElementById('gridScreen');
    VEHICLES.forEach((v, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.style.setProperty('--c', v.color);
      card.innerHTML = `<div class="em">${v.emoji}</div><div class="nm">${v.name}</div>`;
      card.addEventListener('pointerdown', () => {
        card.classList.add('pressed');
        popTone();
        setTimeout(() => { card.classList.remove('pressed'); openVehicle(i); }, 120);
      });
      gridEl.appendChild(card);
    });
    /* ===== VIEWER ===== */
    const canvas = document.getElementById('c3d');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 50);
    camera.position.set(0, 1.5, 4.4);
    camera.lookAt(0, 0.7, 0);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x223355, 1.4));
    const sun = new THREE.DirectionalLight(0xffffff, 2.0);
    sun.position.set(3, 5, 2);
    scene.add(sun);
    const pivot = new THREE.Group();   // pitch (rotation.x)
    const spinner = new THREE.Group(); // yaw (rotation.y); models + light rig live here
    pivot.add(spinner);
    scene.add(pivot);
    const frameHooks = [];
    const loader = new GLTFLoader();
    const modelCache = new Map();

    const TARGET_HEIGHT = 1.5; // cap vertical extent so tall/thin models (crane, boat mast) clear the name label
    function normalize(sceneRoot, rot = 0) {
      const inner = new THREE.Group();
      sceneRoot.rotation.y = rot;
      inner.add(sceneRoot);
      let box = new THREE.Box3().setFromObject(inner);
      const size = box.getSize(new THREE.Vector3());
      inner.scale.setScalar(Math.min(2 / Math.max(size.x, size.y, size.z), TARGET_HEIGHT / size.y));
      box = new THREE.Box3().setFromObject(inner);
      const c = box.getCenter(new THREE.Vector3());
      inner.position.set(-c.x, -box.min.y, -c.z);
      const g = new THREE.Group();
      g.add(inner);
      g.userData.bbox = new THREE.Box3().setFromObject(inner);
      return g;
    }

    function emojiSprite(emoji) {
      const cv = document.createElement('canvas'); cv.width = cv.height = 256;
      const x = cv.getContext('2d');
      x.font = '200px serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
      x.fillText(emoji, 128, 140);
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), transparent: true }));
      sp.scale.setScalar(2); sp.position.y = 1;
      const g = new THREE.Group(); g.add(sp);
      g.userData.bbox = new THREE.Box3(new THREE.Vector3(-1, 0, -0.5), new THREE.Vector3(1, 1.6, 0.5));
      return g;
    }

    function blobShadow() {
      const cv = document.createElement('canvas'); cv.width = cv.height = 128;
      const x = cv.getContext('2d');
      const gr = x.createRadialGradient(64, 64, 8, 64, 64, 64);
      gr.addColorStop(0, 'rgba(0,0,0,0.45)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
      x.fillStyle = gr; x.fillRect(0, 0, 128, 128);
      const m = new THREE.Mesh(
        new THREE.PlaneGeometry(3.2, 3.2),
        new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cv), transparent: true, depthWrite: false })
      );
      m.rotation.x = -Math.PI / 2; m.position.y = 0.01;
      return m;
    }
    spinner.add(blobShadow());

    let modelRoot = null, entranceT = 1, loadSeq = 0;
    function easeOutBack(t) { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
    frameHooks.push(() => {
      if (modelRoot && entranceT < 1) {
        entranceT = Math.min(entranceT + 1 / 30, 1);
        modelRoot.scale.setScalar(Math.max(easeOutBack(entranceT), 0.001));
      }
    });

    async function showModel(v) {
      const seq = ++loadSeq;
      if (modelRoot) { spinner.remove(modelRoot); modelRoot = null; }
      let g = modelCache.get(v.id);
      if (!g) {
        try {
          const gltf = await loader.loadAsync(`models/${v.id}.glb`);
          g = normalize(gltf.scene, v.rot || 0);
          modelCache.set(v.id, g); // only cache successful loads; let failures retry next open
        } catch (e) {
          console.warn('model failed', v.id, e);
          g = emojiSprite(v.emoji);
        }
      }
      if (seq !== loadSeq) return; // user already moved on
      modelRoot = g;
      entranceT = 0;
      modelRoot.scale.setScalar(0.001);
      spinner.add(modelRoot);
    }

    function resize() {
      const w = innerWidth, h = innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    addEventListener('resize', resize);

    let rafId = null, lastT = 0, viewerActive = false;
    function frame(t) {
      rafId = null;
      if (!viewerActive || document.hidden) return;
      const dt = Math.min((t - lastT) / 1000, 0.05); lastT = t;
      frameHooks.forEach(fn => fn(dt));
      renderer.render(scene, camera);
      rafId = requestAnimationFrame(frame);
    }
    function startLoop() { if (!rafId) { lastT = performance.now(); rafId = requestAnimationFrame(frame); } }
    document.addEventListener('visibilitychange', () => { if (!document.hidden) startLoop(); });

    let current = 0;
    function openVehicle(i) {
      current = (i + VEHICLES.length) % VEHICLES.length;
      const v = VEHICLES[current];
      const lbl = document.getElementById('nameLbl');
      lbl.textContent = v.name;
      lbl.style.setProperty('--c', v.color);
      showScreen('viewerScreen');
      viewerActive = true;
      resize();
      startLoop();
      showModel(v);
      // Task 9 adds: speak(v). Task 10 adds: lightsOff().
    }
    function closeViewer() {
      viewerActive = false;
      showScreen('gridScreen');
    }
    function bindBtn(id, fn) {
      const el = document.getElementById(id);
      el.addEventListener('pointerdown', () => {
        el.classList.add('pressed');
        setTimeout(() => el.classList.remove('pressed'), 120);
        fn();
      });
    }
    bindBtn('backBtn', () => { popTone(); closeViewer(); });
    bindBtn('prevBtn', () => { popTone(); openVehicle(current - 1); });
    bindBtn('nextBtn', () => { popTone(); openVehicle(current + 1); });

    window.showScreen = (id) => {
      document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
    };
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then(r => r.update());
    }
  </script>
</body>
</html>
